version: '3.8'

services:
  # FastAPI Backend Service
  backend:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: ivitsh_portal_backend
    restart: always
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:///./portal.db
      - PYTHONPATH=/app/server
    volumes:
      - sqlite_data:/app/server_data
    ports:
      - "127.0.0.1:8000:8000"

  # Nginx Web Server & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ivitsh_portal_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  sqlite_data:
