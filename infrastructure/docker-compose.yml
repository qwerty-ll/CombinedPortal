services:
  # 1. FastAPI Backend Service
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: ivitsh_portal_backend
    restart: always
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite:///./portal.db
      - PYTHONPATH=/app/server
    volumes:
      - sqlite_data:/app/server_data
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - portal_network

  # 2. Nginx Web Server & React Client SPA
  client:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: ivitsh_portal_client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - portal_network

volumes:
  sqlite_data:

networks:
  portal_network:
    driver: bridge
