services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: ivitsh_portal_db
    restart: always
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portal_network

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.server
    container_name: ivitsh_portal_backend
    restart: always
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://portal_user:portal_password@db:5432/portal_db
      - PYTHONPATH=/app/server
    volumes:
      - sqlite_data:/app/server_data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portal_network

  # 3. Nginx Web Server & React Client SPA
  client:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.client
    container_name: ivitsh_portal_client
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - portal_network

volumes:
  sqlite_data:
  postgres_data:

networks:
  portal_network:
    driver: bridge
