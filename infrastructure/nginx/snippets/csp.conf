# The built SPA loads no inline or third-party scripts, and talks only to its own origin.
# style-src keeps 'unsafe-inline' for React style attributes; images may come from kosgos.ru / EIOS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
