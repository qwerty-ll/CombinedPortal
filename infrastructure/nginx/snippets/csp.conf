# The built SPA loads no inline or third-party scripts, and talks only to its own origin.
# Fonts are self-hosted (Golos Text). style-src keeps 'unsafe-inline' for React style attributes;
# images may come from kosgos.ru / EIOS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
