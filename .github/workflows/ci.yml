name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      SECRET_KEY: ci-secret-key-that-is-long-enough-0123456789
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Models match migrations
        run: python -m app.db.migrate && alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate nginx configuration
        run: |
          mkdir -p /tmp/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
            -keyout /tmp/certs/privkey.pem -out /tmp/certs/fullchain.pem
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$PWD/infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/infrastructure/nginx/snippets:/etc/nginx/snippets:ro" \
            -v /tmp/certs:/etc/nginx/certs:ro \
            nginx:1.27-alpine nginx -t

  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the all-in-one container
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/health
          curl -fsS http://127.0.0.1:8080/forum | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/v1/announcements | grep -q 'Посвящение в студенты'
      - name: Container log
        if: always()
        run: docker compose logs
