version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ivitsh_portal_db
    restart: always
    environment:
      POSTGRES_DB: portal_db
      POSTGRES_USER: ivitsh_user
      POSTGRES_PASSWORD: KguPortalSecure2026Password!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivitsh_user -d portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ivitsh_portal_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ivitsh_user:KguPortalSecure2026Password!@db:5432/portal_db
      - SECRET_KEY=ksu_ivitsh_production_jwt_super_secret_key_2026_secure
      - ALGORITHM=HS256
      - GIGACHAT_CLIENT_ID=019e2c26-97a8-75cf-8d25-1caf90fcdd51
      - GIGACHAT_SECRET=MDE5ZTJjMjYtOTdhOC03NWNmLThkMjUtMWNhZjkwZmNkZDUxOjFkODQ2YzZjLTgwNmEtNGIwZi1iZmQ2LTY0Zjg2NTAwMmU2Yg==
    ports:
      - "8000:8000"

  # Nginx Web Server & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ivitsh_portal_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
